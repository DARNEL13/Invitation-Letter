<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walk With Us? | JIL BNT</title>
<style>

 .weave {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.07) 0px, rgba(255,255,255,0.07) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
    opacity: 0.9;
  }
   .blotches {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 24% 30%, rgba(45,55,120,0.35) 0%, transparent 20%),
      radial-gradient(circle at 30% 62%, rgba(40,50,110,0.3) 0%, transparent 18%),
      radial-gradient(circle at 45% 40%, rgba(60,75,150,0.25) 0%, transparent 25%),
      radial-gradient(circle at 63% 65%, rgba(35,90,160,0.25) 0%, transparent 22%),
      radial-gradient(circle at 78% 25%, rgba(200,220,255,0.2) 0%, transparent 20%);
    mix-blend-mode: multiply;
  }

 /*  body { margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#111; }
  img { max-width:100%; height:auto; display:block; } */
 body { margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#111; }
  img { max-width:100%; height:auto; display:block; }
  
  a {
  color:  #4f9bd6;
  text-decoration: none;
  
}
  :root{
    --deep: #0d2b4e;
    --blue: #1c5390;
    --sky: #4f9bd6;
    --light: #a9d3f0;
    --pale: #e3f1fb;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background-image:
      linear-gradient(165deg, rgba(13,43,78,0.82) 0%, rgba(28,83,144,0.72) 35%, rgba(79,155,214,0.55) 65%, rgba(227,241,251,0.4) 100%),
      url('poster.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--white);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 80%, rgba(255,255,255,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 10%, rgba(255,255,255,0.12) 0%, transparent 45%);
    pointer-events: none;
  }

  .stage {
    width: 100%;
    max-width: 640px;
    padding: 40px 32px 64px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .eyebrow {
    letter-spacing: 0.35em;
    font-size: 0.72rem;
    text-transform: uppercase;
    color: var(--pale);
    margin-bottom: 14px;
    font-family: 'Trebuchet MS', sans-serif;
    opacity: 0.9;
  }

  h1 {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 6.5vw, 3.2rem);
    line-height: 1.08;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
    text-shadow: 0 6px 30px rgba(0,0,0,0.35);
    color: var(--white);
  }

  h1 span {
    display: block;
    font-style: italic;
    color: var(--pale);
    font-size: 0.5em;
    letter-spacing: 0.02em;
    margin-top: 10px;
  }

  .tagline {
    font-family: 'Trebuchet MS', sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 0.68rem;
    color: rgba(255,255,255,0.8);
    margin: 18px 0 42px;
  }

  .question {
    font-size: 1.15rem;
    color: var(--white);
    margin-bottom: 38px;
    font-style: italic;
  }

  .btn-field {
    position: relative;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Trebuchet MS', sans-serif;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.3s ease, top 0.28s ease, left 0.28s ease;
  }

  #yesBtn {
    background: linear-gradient(135deg, var(--white), var(--pale));
    color: var(--deep);
    padding: 16px 40px;
    font-size: 1rem;
    box-shadow: 0 10px 30px rgba(255,255,255, 0.3);
    position: relative;
    z-index: 3;
  }

  #yesBtn:hover { transform: translateY(-2px) scale(1.03); }

  #noBtn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.5);
    color: var(--white);
    padding: 14px 32px;
    font-size: 0.95rem;
    z-index: 3;
  }

  .no-static {
    position: static;
  }

  .no-fixed {
    position: fixed;
  }

  /* modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 30, 55, 0.75);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }

  .overlay.show {
    display: flex;
    animation: fadeIn 0.35s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: linear-gradient(165deg, var(--blue), var(--deep));
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 18px;
    max-width: 420px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    animation: pop 0.4s cubic-bezier(.2,1.4,.4,1);
  }

  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal .emoji {
    font-size: 2.4rem;
    margin-bottom: 14px;
  }

  .modal h2 {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-weight: 400;
    font-size: 1.5rem;
    margin: 0 0 16px;
    color: var(--white);
  }

  .modal p {
    margin: 0 0 10px;
    color: var(--pale);
    line-height: 1.5;
    font-size: 0.98rem;
  }

  .detail-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0;
    font-family: 'Trebuchet MS', sans-serif;
    letter-spacing: 0.03em;
  }

  .detail-row .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.6);
    display: block;
    margin-bottom: 4px;
  }

  .detail-row .value {
    font-size: 0.95rem;
    color: var(--white);
    font-weight: 600;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: rgba(255, 255, 255, 0.4);
    margin: 20px auto;
  }

  .see-you {
    margin-top: 20px;
    font-style: italic;
    color: var(--white);
    font-size: 1.05rem;
  }

  .close-btn {
    margin-top: 26px;
    background: rgba(255,255,255,0.12);
    color: var(--white);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 28px;
    border-radius: 999px;
    font-size: 0.85rem;
  }
   
  .underline {
  text-decoration: underline;
}


  @media (max-width: 480px) {
    .btn-field { height: 220px; }
  }
</style>
</head>

      <button class="close-btn" onclick="closeModal()">Close</button>

  </div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  let clicks = 0;

  function rectsOverlap(a, b, buffer) {
    return !(
      a.right + buffer < b.left ||
      a.left - buffer > b.right ||
      a.bottom + buffer < b.top ||
      a.top - buffer > b.bottom
    );
  }

  function dodgeNo() {
    clicks++;

    function dodgeNo() {
    clicks++;
     if (clicks >= 31) {
     document.getElementById('overlay').classList.add('show');                 
    return; // stop further execution
  }

    // grow the yes button every click
    const scale = 1 + clicks * 0.18;
    yesBtn.style.transform = `scale(${scale})`;
    yesBtn.style.fontSize = (1 + clicks * 0.08) + 'rem';

    // switch no button to fixed positioning so it can roam the whole viewport
    noBtn.classList.remove('no-static');
    noBtn.classList.add('no-fixed');

    const btnWidth = noBtn.offsetWidth || 120;
    const btnHeight = noBtn.offsetHeight || 50;
    const maxX = Math.max(10, window.innerWidth - btnWidth - 20);
    const maxY = Math.max(10, window.innerHeight - btnHeight - 20);

    const yesRect = yesBtn.getBoundingClientRect();
    const buffer = 30;

    let randX, randY, candidateRect, tries = 0;
    do {
      randX = Math.max(10, Math.random() * maxX);
      randY = Math.max(10, Math.random() * maxY);
      candidateRect = {
        left: randX,
        right: randX + btnWidth,
        top: randY,
        bottom: randY + btnHeight
      };
      tries++;
    } while (rectsOverlap(candidateRect, yesRect, buffer) && tries < 80);

    noBtn.style.left = randX + 'px';
    noBtn.style.top = randY + 'px';

    // shrink the no button's confidence a little as it flees
    const noScale = Math.max(0.55, 1 - clicks * 0.05);
    noBtn.style.transform = `scale(${noScale})`;

    // occasionally soften the copy
    const phrases = ["No", "Nope", "Not sure...", "Maybe not", "Try again?", "Nuh-uh", "Hmm...", "Please?", "Nuh-uh"];
    noBtn.textContent = phrases[Math.min(clicks, phrases.length - 1)];
  }

  function openModal() {
    document.getElementById('overlay').classList.add('show');
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('show');
    resetGame();
  }

  function resetGame() {
    clicks = 0;

    // reset yes button back to its original size
    yesBtn.style.transform = 'scale(1)';
    yesBtn.style.fontSize = '1rem';

    // reset no button back to its original state, style and position
    noBtn.classList.remove('no-fixed');
    noBtn.classList.add('no-static');
    noBtn.style.left = '';
    noBtn.style.top = '';
    noBtn.style.transform = 'scale(1)';
    noBtn.textContent = 'No';
  }
</script>
